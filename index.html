<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>El Cazador de NotPikachus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --ink:#3b2547;
  --orange:#ff9f1c;
  --cream:#fff4d6;
  --sky:#cdeaff;
  --mint:#3dd68c;
  --danger:#ef476f;
  --toxic:#9b5de5;
  --page:#ffd9a8;
  --page2:#ffc6d9;
  --s:1;
  --display:'Lilita One','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  --body:'Baloo 2','Trebuchet MS','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--page:#2b1d3a;--page2:#3d2550;}
}
:root[data-theme="dark"]{--page:#2b1d3a;--page2:#3d2550;}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--page);
  background-image:radial-gradient(circle at 20% 15%,var(--page2) 0 18%,transparent 19%),
                   radial-gradient(circle at 85% 80%,var(--page2) 0 14%,transparent 15%);
  font-family:var(--body);color:var(--ink);overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  -webkit-user-select:none;user-select:none;
}
#frame{
  position:relative;width:540px;height:800px;
  border:calc(var(--s)*5px) solid var(--ink);
  border-radius:calc(var(--s)*26px);
  overflow:hidden;background:var(--sky);
  box-shadow:0 calc(var(--s)*10px) 0 var(--ink);
  touch-action:none;
}
canvas{display:block;width:100%;height:100%}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none;padding:calc(var(--s)*14px);opacity:0;transition:opacity .25s}
#hud.on{opacity:1}
.row{display:flex;justify-content:space-between;align-items:center;gap:calc(var(--s)*8px)}
.pill{
  display:flex;align-items:center;gap:calc(var(--s)*6px);
  background:#fff;border:calc(var(--s)*3px) solid var(--ink);border-radius:999px;
  padding:calc(var(--s)*2px) calc(var(--s)*14px) calc(var(--s)*2px) calc(var(--s)*4px);
  font-family:var(--display);font-size:calc(var(--s)*28px);line-height:1.1;
  box-shadow:0 calc(var(--s)*4px) 0 var(--ink);
}
.pill img{width:calc(var(--s)*38px);height:calc(var(--s)*38px);object-fit:contain}
#streak{padding-left:calc(var(--s)*14px);font-size:calc(var(--s)*20px);transition:transform .12s}
#streak b{color:var(--orange);-webkit-text-stroke:calc(var(--s)*1px) var(--ink)}
#streak.bump{transform:scale(1.18) rotate(-4deg)}
#streak.broken{background:#ffd1dc}
.bar{
  margin-top:calc(var(--s)*12px);position:relative;height:calc(var(--s)*30px);
  background:#fff;border:calc(var(--s)*3px) solid var(--ink);border-radius:999px;overflow:hidden;
  box-shadow:0 calc(var(--s)*4px) 0 var(--ink);
}
#barFill{position:absolute;left:0;top:0;bottom:0;width:100%;background:var(--mint);
  background-image:repeating-linear-gradient(-45deg,rgba(255,255,255,.28) 0 10px,transparent 10px 20px);
  border-right:calc(var(--s)*3px) solid var(--ink);transition:background-color .3s}
#barFill.mid{background-color:#ffcf3f}
#barFill.low{background-color:var(--danger);animation:pulse .5s infinite alternate}
@keyframes pulse{to{filter:brightness(1.35)}}
#timeTxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--display);font-size:calc(var(--s)*19px);color:var(--ink);letter-spacing:.02em}
#mute{
  pointer-events:auto;position:absolute;right:calc(var(--s)*14px);bottom:calc(var(--s)*12px);
  width:calc(var(--s)*40px);height:calc(var(--s)*40px);border-radius:50%;
  border:calc(var(--s)*3px) solid var(--ink);background:#fff;font-size:calc(var(--s)*18px);cursor:pointer;
  box-shadow:0 calc(var(--s)*3px) 0 var(--ink);
}

/* ---------- Screens ---------- */
.screen{
  position:absolute;inset:0;padding-top:calc(var(--s)*70px) !important;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:calc(var(--s)*26px);
  background:rgba(59,37,71,.38);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
}
.screen.hidden{display:none}
.card{
  position:relative;background:var(--cream);border:calc(var(--s)*5px) solid var(--ink);
  border-radius:calc(var(--s)*28px);padding:calc(var(--s)*26px) calc(var(--s)*24px) calc(var(--s)*24px);
  width:100%;box-shadow:0 calc(var(--s)*8px) 0 var(--ink);
}
.peek{position:absolute;width:calc(var(--s)*96px);top:calc(var(--s)*-84px);left:50%;transform:translateX(-50%);
  animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateX(-50%) translateY(calc(var(--s)*-6px)) rotate(4deg)}}
h1{
  margin:calc(var(--s)*6px) 0 calc(var(--s)*4px);font-family:var(--display);font-weight:400;
  font-size:calc(var(--s)*46px);line-height:.95;color:var(--orange);
  -webkit-text-stroke:calc(var(--s)*2px) var(--ink);paint-order:stroke fill;
  text-shadow:0 calc(var(--s)*4px) 0 var(--ink);
}
h1 small{display:block;font-size:.55em;color:#fff;margin-bottom:calc(var(--s)*2px)}
.lead{font-size:calc(var(--s)*17px);margin:calc(var(--s)*8px) 0 calc(var(--s)*14px);line-height:1.3;font-weight:500}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--s)*6px) calc(var(--s)*10px);text-align:left;
  margin-bottom:calc(var(--s)*18px)}
.legend > div{display:flex;align-items:center;gap:calc(var(--s)*8px);font-size:calc(var(--s)*14px);line-height:1.15;font-weight:700}
.legend img{width:calc(var(--s)*34px);height:calc(var(--s)*34px);object-fit:contain;flex:none}
.legend .good{grid-column:1/-1;background:#d8f8e7;border-radius:calc(var(--s)*12px);padding:calc(var(--s)*4px) calc(var(--s)*8px)}
.legend .good .imgs{display:flex}
.legend .good .imgs img{margin-right:calc(var(--s)*-10px)}
.legend span{display:block;font-weight:500;color:#7a5a85;font-size:.92em}
.legend em{font-style:normal;color:var(--danger)}
.btn{
  font-family:var(--display);font-size:calc(var(--s)*30px);color:#fff;background:var(--orange);
  border:calc(var(--s)*4px) solid var(--ink);border-radius:999px;padding:calc(var(--s)*8px) calc(var(--s)*44px);
  cursor:pointer;box-shadow:0 calc(var(--s)*6px) 0 var(--ink);-webkit-text-stroke:calc(var(--s)*1.4px) var(--ink);
  paint-order:stroke fill;transition:transform .08s,box-shadow .08s;
}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(calc(var(--s)*5px));box-shadow:0 calc(var(--s)*1px) 0 var(--ink)}
.btn:focus-visible,#mute:focus-visible{outline:calc(var(--s)*4px) solid #fff;outline-offset:calc(var(--s)*3px)}
.hint{margin-top:calc(var(--s)*14px);font-size:calc(var(--s)*14px);color:#7a5a85;font-weight:700}
.big{font-family:var(--display);font-size:calc(var(--s)*96px);line-height:1;color:var(--orange);
  -webkit-text-stroke:calc(var(--s)*3px) var(--ink);paint-order:stroke fill;text-shadow:0 calc(var(--s)*6px) 0 var(--ink);
  margin:calc(var(--s)*4px) 0}
.stats{display:flex;justify-content:center;gap:calc(var(--s)*10px);margin:calc(var(--s)*10px) 0 calc(var(--s)*20px);flex-wrap:wrap}
.stats div{background:#fff;border:calc(var(--s)*3px) solid var(--ink);border-radius:calc(var(--s)*14px);
  padding:calc(var(--s)*4px) calc(var(--s)*12px);font-size:calc(var(--s)*14px);font-weight:700}
.stats b{display:block;font-family:var(--display);font-weight:400;font-size:calc(var(--s)*24px)}
#newRec{display:inline-block;background:#ffe14d;border:calc(var(--s)*3px) solid var(--ink);border-radius:999px;
  padding:0 calc(var(--s)*14px);font-weight:800;font-size:calc(var(--s)*16px);transform:rotate(-4deg)}
#count{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;
  font-family:var(--display);font-size:calc(var(--s)*130px);color:#fff;-webkit-text-stroke:calc(var(--s)*4px) var(--ink);
  paint-order:stroke fill;text-shadow:0 calc(var(--s)*8px) 0 var(--ink)}
#count.pop{animation:pop .7s ease-out forwards}
@keyframes pop{0%{transform:scale(1.6);opacity:0}25%{transform:scale(1);opacity:1}100%{transform:scale(.9);opacity:0}}
@media (prefers-reduced-motion: reduce){.peek,#count.pop,#barFill.low{animation:none}}
</style>
</head>
<body>
<div id="frame">
  <canvas id="cv" aria-label="Zona de juego"></canvas>

  <div id="hud">
    <div class="row">
      <div class="pill"><img id="hudIcon" alt=""><span id="score">0</span></div>
      <div class="pill" id="streak">Racha&nbsp;<b id="streakN">0</b></div>
    </div>
    <div class="bar"><div id="barFill"></div><div id="timeTxt">30.0 s</div></div>
    <button id="mute" aria-label="Silenciar sonido">🔊</button>
  </div>

  <div class="screen" id="menu">
    <div class="card">
      <img class="peek" id="peekMenu" alt="">
      <h1><small>El Cazador de</small>NotPikachus</h1>
      <p class="lead">Atrapa con la cesta todos los Dedenne que caigan antes de que se acabe el tiempo.</p>
      <div class="legend" id="legend"></div>
      <button class="btn" id="startBtn">Jugar</button>
      <div class="hint">Flechas o A/D, ratón o dedo para moverte. P para pausar.</div>
    </div>
  </div>

  <div class="screen hidden" id="over">
    <div class="card">
      <img class="peek" id="peekOver" alt="">
      <h1 style="font-size:calc(var(--s)*40px)">¡Se acabó el tiempo!</h1>
      <div class="big" id="finalScore">0</div>
      <div id="newRec" hidden>¡Nuevo récord!</div>
      <div class="stats">
        <div>Dedenne<b id="stCaught">0</b></div>
        <div>Mejor racha<b id="stStreak">0</b></div>
        <div>Récord<b id="stBest">0</b></div>
      </div>
      <button class="btn" id="restartBtn">Reiniciar</button>
    </div>
  </div>

  <div class="screen hidden" id="pause">
    <div class="card">
      <h1 style="font-size:calc(var(--s)*44px)">Pausa</h1>
      <p class="lead">Dedenne se está echando una siesta.</p>
      <button class="btn" id="resumeBtn">Seguir</button>
    </div>
  </div>

  <div id="count"></div>
</div>

const W = 540, H = 800, GROUND = H - 58;
const frame = document.getElementById('frame');
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
let scale = 1, dpr = 1;

function fit(){
  const vw = window.innerWidth, vh = window.innerHeight;
  scale = Math.min((vw - 20) / (W + 10), (vh - 30) / (H + 20));
  scale = Math.max(0.3, Math.min(scale, 1.35));
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  frame.style.width = (W * scale) + 'px';
  frame.style.height = (H * scale) + 'px';
  document.documentElement.style.setProperty('--s', scale.toFixed(3));
  cv.width = Math.round(W * scale * dpr);
  cv.height = Math.round(H * scale * dpr);
}
window.addEventListener('resize', fit);
fit();

let actx = null, muted = false;
function sfx(notes){
  if (muted) return;
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    let t = actx.currentTime;
    for (const [f, d, type='square', f2=f, vol=.07] of notes){
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(Math.max(30,f2), t + d);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + d + .02);
      t += d * .85;
    }
  }catch(e){}
}
const SND = {
  catch: s => sfx([[660+s*30,.06],[990+s*30,.08]]),
  berry: () => sfx([[523,.07,'triangle'],[659,.07,'triangle'],[784,.12,'triangle']]),
  bad:   () => sfx([[220,.18,'sawtooth',90,.08]]),
  zap:   () => sfx([[1200,.05,'square',300],[900,.05,'square',200],[1400,.08,'square',150]]),
  toxic: () => sfx([[300,.12,'sawtooth',120,.09],[200,.25,'sawtooth',60,.09]]),
  miss:  () => sfx([[400,.1,'triangle',200,.05]]),
  tick:  () => sfx([[1000,.03,'square',1000,.03]]),
  go:    () => sfx([[784,.1,'square'],[1047,.16,'square']]),
  over:  () => sfx([[784,.12,'triangle'],[659,.12,'triangle'],[523,.12,'triangle'],[392,.3,'triangle']]),
};
$('mute').addEventListener('click', e => {

});

/* ======================= Helpers ======================= */
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function pickBad(){
  const list = Object.entries(BAD); let tot = list.reduce((s, [,b]) => s + b.w, 0), r = Math.random() * tot;
  for (const [k, b] of list){ if ((r -= b.w) <= 0) return k; } return 'bomb';
}
function diff(){ return clamp(S.elapsed / 60, 0, 1); }
function spawnX(minGap){
  let x, tries = 0;
  do { x = rand(48, W - 48); tries++; } while (tries < 20 && Math.abs(x - S.lastNkX) < minGap);
  return x;
}
function addObj(type, kind, img, size, x, vy){
  S.objs.push({ type, kind, img, size, x, y: -size, prevY: -size, vy, rot: rand(-.3,.3), vr: rand(-2,2),
    phase: rand(0, 6.28), born: S.elapsed, dead: false, alpha: 1 });
}
function pop(x, y, text, color, big){ S.pops.push({ x, y, text, color, life: 1, big: !!big }); }
function burst(x, y, colors, n, spd = 260){
  for (let i = 0; i < n; i++){
    const a = rand(0, Math.PI*2), v = rand(spd*.3, spd);
    S.parts.push({ x, y, vx: Math.cos(a)*v, vy: Math.sin(a)*v - 80, life: 1, decay: rand(1.4, 2.4),
      size: rand(3, 7), color: colors[i % colors.length], star: Math.random() < .35 });
  }
}
function addTime(dt){ S.time = clamp(S.time + dt, 0, T_MAX); }
function shake(t, m){ S.shake = Math.max(S.shake, t); S.shakeMag = Math.max(S.shakeMag, m); }

/* ======================= Catch effects ======================= */
function onCatch(o){
  const x = o.x, y = GROUND - P.h + 10;
  P.squash = 1;
  if (o.type === 'nk'){
    S.streak++; S.bestStreak = Math.max(S.bestStreak, S.streak); S.caught++;
    const pts = 1 + Math.min(3, Math.floor(S.streak / 5));
    S.score += pts;
    pop(x, y - 30, '+' + pts, '#ff9f1c', pts > 1);
    burst(x, y, ['#ffe14d','#ff9f1c','#fff'], 16);
    SND.catch(Math.min(S.streak, 20));
    S.nkDelay = rand(.15, .45);
    bumpStreak();
  } else if (o.type === 'good'){
    addTime(4); S.score += 2;
    pop(x, y - 30, '+4 s', '#2bb673', true); pop(x + 26, y - 4, '+2', '#ff9f1c');
    burst(x, y, ['#3dd68c','#b8ffd9','#fff'], 18);
    S.flash = { c: '61,214,140', a: .25 };
    SND.berry();
  } else {
    const b = BAD[o.kind];
    addTime(b.t);
    pop(x, y - 34, b.t + ' s', '#ef476f', true);
    pop(W/2, H*.42, b.msg, b.color, true);
    burst(x, y, ['#3b2547','#ef476f','#999'], 14);
    if (o.kind === 'bomb'){
      P.freeze = 1; shake(.35, 10); S.flash = { c: '255,255,255', a: .7 };
      burst(x, y, ['#ffb703','#fb8500','#3b2547'], 26, 380); SND.bad();
    } else if (o.kind === 'electrode'){
      if (S.streak > 0) $('streak').classList.add('broken');
      S.streak = 0; S.zapT = .45; S.flash = { c: '255,241,118', a: .55 }; shake(.25, 6); SND.zap();
      setTimeout(() => $('streak').classList.remove('broken'), 700);
    } else if (o.kind === 'rotten'){
      S.dirtT = 2.2; makeSplats(); SND.bad();
    } else if (o.kind === 'magazine'){
      const nk = S.objs.find(q => q.type === 'nk' && !q.dead);
      if (nk){ nk.dead = true; burst(nk.x, nk.y, ['#cdeaff','#fff','#9ad0ff'], 22); pop(nk.x, nk.y, '¡puf!', '#2f80ed'); }
      S.nkDelay = 1.1; SND.bad();
    } else if (o.kind === 'toxic'){
      P.poison = 1.6; shake(.7, 16); S.flash = { c: '155,93,229', a: .6 };
      burst(x, y, ['#9b5de5','#c77dff','#3b2547'], 34, 420); SND.toxic();
    }
  }
  updateHUD();
}
function bumpStreak(){
  const el = $('streak'); el.classList.add('bump'); setTimeout(() => el.classList.remove('bump'), 120);
}
function makeSplats(){
  S.splats = [];
  for (let i = 0; i < 7; i++){
    const blobs = [];
    const r = rand(45, 95);
    for (let j = 0; j < 9; j++) blobs.push([rand(-r*.7, r*.7), rand(-r*.7, r*.7), rand(r*.25, r*.6)]);
    S.splats.push({ x: rand(40, W-40), y: rand(140, H-160), r, blobs, c: Math.random() < .5 ? '#4f5b2a' : '#3b3a52' });
  }
}

/* ======================= HUD ======================= */
function updateHUD(force){
  $('score').textContent = S.score;
  $('streakN').textContent = S.streak >= 5 ? `${S.streak} ×${1 + Math.min(3, Math.floor(S.streak/5))}` : S.streak;
  const f = clamp(S.time / T_MAX, 0, 1);

  $('timeTxt').textContent = S.time.toFixed(1) + ' s';
}

/* ======================= Update ======================= */
function update(dt){
  // decorative clouds always move
  for (const c of clouds){ c.x += c.v * dt; if (c.x > W + 120) c.x = -140; }
  if (!S) return;

  if (S.mode === 'count'){
    S.countT -= dt;
    const n = Math.ceil(S.countT / .8);
    if (n !== S.lastCount){
      S.lastCount = n;
      const el = $('count'); el.textContent = n > 0 ? n : '¡Ya!';
      el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
      clearTimeout(S.countTO); S.countTO = setTimeout(() => { el.textContent = ''; }, 700);
      n > 0 ? SND.tick() : SND.go();
    }
    updatePlayer(dt);
    if (S.countT <= 0){ S.mode = 'play'; }
    return;
  }
  if (S.mode === 'over'){
    S.overT += dt;
    updateFx(dt);
    return;
  }
  if (S.mode !== 'play') return;

  S.elapsed += dt;
  S.time -= dt;
  const d = diff();

  // low time ticks
  if (S.time <= 5 && Math.ceil(S.time) !== S.lastTick){ S.lastTick = Math.ceil(S.time); if (S.time > 0) SND.tick(); }

  // spawners
  if (!S.objs.some(o => o.type === 'nk' && !o.dead)){
    S.nkDelay -= dt;
    if (S.nkDelay <= 0){
      const x = spawnX(120); S.lastNkX = x;
      addObj('nk', 'nk', NK[(Math.random()*NK.length)|0], 80, x, 210 + d*230);
    }
  }
  S.goodT -= dt;
  if (S.goodT <= 0){
    S.goodT = rand(4.2, 7.5);
    addObj('good', 'good', GOOD[(Math.random()*GOOD.length)|0], 56, spawnX(70), 190 + d*140);
  }
  S.badT -= dt;
  if (S.badT <= 0){
    S.badT = rand(.55, 1.15) * (1.55 - d*.75);
    const k = pickBad(), b = BAD[k];
    addObj('bad', k, b.img, b.size, rand(40, W-40), (k === 'toxic' ? 240 : 200) + d*220 + rand(-20, 30));
  }

  updatePlayer(dt);

  // objects
  const rimY = GROUND - P.h + 18;
  for (const o of S.objs){
    if (o.dead) continue;
    o.prevY = o.y;
    o.vy += 60 * dt;
    o.y += o.vy * dt;
    o.rot += o.vr * dt;
    if (o.kind === 'toxic') o.x = clamp(o.x + Math.sin(S.elapsed*3.2 + o.phase) * 130 * dt, 30, W-30);
    if (o.kind === 'bomb' && Math.random() < .5)
      S.parts.push({ x: o.x + Math.cos(o.rot - 1.2)*o.size*.38, y: o.y - o.size*.45, vx: rand(-40,40), vy: rand(-90,-30),
        life: .6, decay: 2.5, size: rand(2,4), color: Math.random()<.5?'#ffb703':'#fff3b0', star: false });
    if (o.kind === 'toxic' && Math.random() < .35)
      S.parts.push({ x: o.x + rand(-12,12), y: o.y - 10, vx: rand(-20,20), vy: -40, life: .7, decay: 1.6,
        size: rand(3,6), color: '#c77dff', star: false });

    const line = rimY - o.size * .3;
    if (o.prevY < line && o.y >= line && Math.abs(o.x - P.x) < P.w/2 - 4){
      o.dead = true; onCatch(o); continue;
    }
    if (o.y > GROUND - o.size * .35){
      o.dead = true;
      if (o.type === 'nk'){
        if (S.streak > 0){ $('streak').classList.add('broken'); setTimeout(() => $('streak').classList.remove('broken'), 600); }
        S.streak = 0; S.nkDelay = rand(.2, .5);
        pop(o.x, GROUND - 50, '¡Se escapó!', '#7a5a85');
        burst(o.x, GROUND - 10, ['#e9d8a6','#fff'], 10, 150);
        SND.miss(); updateHUD();
      } else {
        burst(o.x, GROUND - 10, ['#e9d8a6','#fff'], 6, 110);
      }
    }
  }
  S.objs = S.objs.filter(o => !o.dead);

  updateFx(dt);
  updateHUD();

  if (S.time <= 0){
    S.time = 0; S.mode = 'over'; S.overT = 0; updateHUD();
    SND.over();
    const isRec = S.score > best;
    if (isRec){ best = S.score; try{ localStorage.setItem('cazador-notpika-best', best); }catch(e){} }
    setTimeout(() => {
      $('finalScore').textContent = S.score;
      $('stCaught').textContent = S.caught;
      $('stStreak').textContent = S.bestStreak;
      $('stBest').textContent = best;
      $('newRec').hidden = !(isRec && S.score > 0);
      $('over').classList.remove('hidden');
      $('hud').classList.remove('on');
      $('restartBtn').focus();
    }, 900);
  }
}

function updatePlayer(dt){
  if (P.freeze > 0){ P.freeze -= dt; P.vx *= Math.pow(.02, dt); }
  else if (useMouse && pointerX !== null){
    P.vx = clamp((pointerX - P.x) * 14, -950, 950);
  } else {
    const dir = (keys.R ? 1 : 0) - (keys.L ? 1 : 0);
    P.vx += (dir * 640 - P.vx) * Math.min(1, dt * 11);
  }
  P.x = clamp(P.x + P.vx * dt, P.w/2, W - P.w/2);
  if (P.x <= P.w/2 || P.x >= W - P.w/2) P.vx *= .3;
  P.tilt += (clamp(P.vx / 900, -1, 1) * .12 - P.tilt) * Math.min(1, dt * 10);
  P.squash = Math.max(0, P.squash - dt * 5);
  P.poison = Math.max(0, P.poison - dt);
}

function updateFx(dt){
  for (const p of S.parts){ p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 520*dt; p.life -= p.decay*dt; }
  S.parts = S.parts.filter(p => p.life > 0);
  for (const p of S.pops){ p.y -= 55*dt; p.life -= dt * .9; }
  S.pops = S.pops.filter(p => p.life > 0);
  S.shake = Math.max(0, S.shake - dt); if (!S.shake) S.shakeMag = 0;
  if (S.flash){ S.flash.a -= dt * 1.8; if (S.flash.a <= 0) S.flash = null; }
  S.dirtT = Math.max(0, S.dirtT - dt);
  S.zapT = Math.max(0, S.zapT - dt);
}

/* ======================= Draw ======================= */
const clouds = Array.from({length: 5}, (_, i) => ({ x: rand(-100, W), y: 90 + i*95 + rand(-20, 20), s: rand(.7, 1.3), v: rand(8, 22) }));

function drawImg(key, x, y, size, rot = 0, alpha = 1){
  const im = IMG[key]; if (!im || !im.complete || !im.naturalWidth) return;
  const k = size / Math.max(im.naturalWidth, im.naturalHeight);
  const w = im.naturalWidth * k, h = im.naturalHeight * k;
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x, y); ctx.rotate(rot);
  ctx.drawImage(im, -w/2, -h/2, w, h); ctx.restore();
}
function roundCloud(x, y, s){
  ctx.beginPath();
  ctx.arc(x, y, 26*s, 0, 7); ctx.arc(x+30*s, y-14*s, 32*s, 0, 7); ctx.arc(x+64*s, y, 24*s, 0, 7);
  ctx.rect(x, y-4*s, 64*s, 28*s); ctx.fill();
}
function drawBackground(){
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#a8dcff'); g.addColorStop(.62, '#e3f4ff'); g.addColorStop(1, '#fff1d9');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // sun
  ctx.fillStyle = '#fff7b8'; ctx.beginPath(); ctx.arc(W - 90, 175, 46, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,247,184,.35)'; ctx.beginPath(); ctx.arc(W - 90, 175, 70, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.92)';
  for (const c of clouds) roundCloud(c.x, c.y, c.s);
  // hills
  ctx.fillStyle = '#9fe2a8';
  ctx.beginPath(); ctx.moveTo(0, GROUND - 70);
  ctx.quadraticCurveTo(120, GROUND - 170, 260, GROUND - 80);
  ctx.quadraticCurveTo(390, GROUND - 10, W, GROUND - 120); ctx.lineTo(W, GROUND); ctx.lineTo(0, GROUND); ctx.fill();
  ctx.fillStyle = '#6fcf8a';
  ctx.beginPath(); ctx.moveTo(0, GROUND - 22);
  ctx.quadraticCurveTo(200, GROUND - 90, 360, GROUND - 30);
  ctx.quadraticCurveTo(460, GROUND, W, GROUND - 40); ctx.lineTo(W, GROUND); ctx.lineTo(0, GROUND); ctx.fill();
  // ground
  ctx.fillStyle = '#ffd98a'; ctx.fillRect(0, GROUND, W, H - GROUND);
  ctx.fillStyle = '#3b2547'; ctx.fillRect(0, GROUND, W, 4);
  ctx.fillStyle = '#f2c46d';
  for (let x = 14; x < W; x += 46) { ctx.beginPath(); ctx.ellipse(x, GROUND + 26 + (x % 3)*8, 9, 4, 0, 0, 7); ctx.fill(); }
}
function drawShadows(){
  for (const o of S.objs){
    const t = clamp((o.y + 100) / (GROUND + 100), 0, 1);
    ctx.fillStyle = `rgba(59,37,71,${.08 + t*.2})`;
    ctx.beginPath(); ctx.ellipse(o.x, GROUND + 6, o.size*.15 + t*o.size*.25, 5 + t*3, 0, 0, 7); ctx.fill();
  }
}
function drawObjects(){
  for (const o of S.objs){
    if (o.type === 'good'){
      ctx.fillStyle = 'rgba(61,214,140,.28)';
      ctx.beginPath(); ctx.arc(o.x, o.y, o.size*.62 + Math.sin(S.elapsed*8 + o.phase)*3, 0, 7); ctx.fill();
    }
    if (o.type === 'nk'){
      ctx.fillStyle = 'rgba(255,225,77,.35)';
      ctx.beginPath(); ctx.arc(o.x, o.y, o.size*.58, 0, 7); ctx.fill();
    }
    if (o.kind === 'electrode' && Math.random() < .6) drawBolt(o.x + rand(-30,30), o.y + rand(-30,30), 18);
    const wob = o.type === 'nk' ? Math.sin(S.elapsed*6 + o.phase) * .25 : o.rot;
    drawImg(o.img, o.x, o.y, o.size, wob, o.alpha);
  }
}
function drawBolt(x, y, len){
  ctx.save(); ctx.strokeStyle = '#ffe14d'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x, y);
  for (let i = 0; i < 3; i++) ctx.lineTo(x + rand(-len, len), y + rand(-len, len));
  ctx.stroke(); ctx.restore();
}
function drawPlayer(){
  const sq = P.squash, baseY = GROUND;
  const bw = P.w * (1 + sq*.08), bh = P.h * (1 - sq*.1);
  ctx.save();
  ctx.translate(P.x, baseY);
  ctx.rotate(P.tilt);
  // shadow
  ctx.fillStyle = 'rgba(59,37,71,.25)'; ctx.beginPath(); ctx.ellipse(0, 4, bw*.48, 8, 0, 0, 7); ctx.fill();
  // Dedenne behind the basket
  const hop = P.freeze > 0 ? 0 : Math.abs(Math.sin(performance.now()/120)) * Math.min(1, Math.abs(P.vx)/400) * 6;
  ctx.save();
  if (P.poison > 0) ctx.filter = 'hue-rotate(220deg) saturate(1.4)';
  else if (P.freeze > 0) ctx.filter = 'grayscale(.7) brightness(.9)';
  const face = P.vx < -30 ? -1 : 1;
  ctx.translate(0, -bh - 20 - hop + sq*6);
  ctx.scale(face, 1);
  drawImg('notpikachu3', 0, 0, 92);
  ctx.restore();
  // basket
  const im = IMG.cesta;
  if (im && im.naturalWidth) ctx.drawImage(im, -bw/2, -bh, bw, bh);
  ctx.restore();

  // dizzy stars
  if (P.freeze > 0){
    const t = performance.now()/200;
    for (let i = 0; i < 3; i++){
      const a = t + i*2.1;
      drawStar(P.x + Math.cos(a)*34, GROUND - P.h - 70 + Math.sin(a)*8, 7, '#ffe14d');
    }
  }
  if (P.poison > 0){
    for (let i = 0; i < 2; i++){
      if (Math.random() < .3) S.parts.push({ x: P.x + rand(-30,30), y: GROUND - P.h - 40, vx: 0, vy: -60, life: .6, decay: 1.5, size: rand(3,6), color: '#c77dff', star: false });
    }
  }
}
function drawStar(x, y, r, color){
  ctx.save(); ctx.translate(x, y); ctx.fillStyle = color; ctx.strokeStyle = '#3b2547'; ctx.lineWidth = 2;
  ctx.beginPath();
  for (let i = 0; i < 10; i++){ const rr = i % 2 ? r*.45 : r; const a = i * Math.PI/5 - Math.PI/2; ctx.lineTo(Math.cos(a)*rr, Math.sin(a)*rr); }
  ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
}
function drawParticles(){
  for (const p of S.parts){
    ctx.globalAlpha = clamp(p.life, 0, 1);
    if (p.star) drawStar(p.x, p.y, p.size*1.3, p.color);
    else { ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, 7); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
}
function drawPops(){
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  for (const p of S.pops){
    const a = clamp(p.life * 2, 0, 1);
    const sc = 1 + (1 - Math.min(1, (1 - p.life) * 6)) * .5;
    ctx.save(); ctx.globalAlpha = a; ctx.translate(p.x, p.y); ctx.scale(sc, sc);
    ctx.font = `${p.big ? 34 : 26}px 'Lilita One', 'Trebuchet MS', sans-serif`;
    ctx.lineWidth = 7; ctx.strokeStyle = '#3b2547'; ctx.strokeText(p.text, 0, 0);
    ctx.fillStyle = p.color === '#3b2547' ? '#fff' : p.color; ctx.fillText(p.text, 0, 0);
    ctx.restore();
  }
}
function drawSplats(){
  if (S.dirtT <= 0) return;
  const a = Math.min(1, S.dirtT / .6) * .92;
  ctx.save(); ctx.globalAlpha = a;
  for (const s of S.splats){
    ctx.fillStyle = s.c;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r*.55, 0, 7); ctx.fill();
    for (const [dx, dy, r] of s.blobs){ ctx.beginPath(); ctx.arc(s.x + dx, s.y + dy, r, 0, 7); ctx.fill(); }
    ctx.fillStyle = 'rgba(255,255,255,.18)';
    ctx.beginPath(); ctx.arc(s.x - s.r*.2, s.y - s.r*.2, s.r*.15, 0, 7); ctx.fill();
  }
  ctx.restore();
}
function drawOverlays(){
  if (S.zapT > 0) for (let i = 0; i < 5; i++) drawBolt(rand(0, W), rand(0, H), 60);
  if (P.poison > 0){
    const a = P.poison / 1.6 * .45;
    const g = ctx.createRadialGradient(W/2, H/2, H*.25, W/2, H/2, H*.75);
    g.addColorStop(0, 'rgba(155,93,229,0)'); g.addColorStop(1, `rgba(120,50,190,${a})`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  if (S.mode === 'play' && S.time <= 5){
    const a = (Math.sin(performance.now()/120) * .5 + .5) * .22;
    ctx.strokeStyle = `rgba(239,71,111,${a})`; ctx.lineWidth = 24; ctx.strokeRect(0, 0, W, H);
  }
  if (S.flash){ ctx.fillStyle = `rgba(${S.flash.c},${Math.max(0, S.flash.a)})`; ctx.fillRect(0, 0, W, H); }
}

function render(){
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  ctx.save();
  if (S && S.shake > 0){
    const m = S.shakeMag * (S.shake / .5);
    ctx.translate(rand(-m, m), rand(-m, m));
  }
  drawBackground();
  if (S){
    drawShadows();
    drawObjects();
    drawPlayer();
    drawParticles();
    drawSplats();
    drawPops();
    drawOverlays();
  } else {
    // menu idle: a sleepy Dedenne with basket
    ctx.save(); ctx.translate(W/2, GROUND);
    drawImg('notpikachu3', 0, -P.h - 20, 92);
    if (IMG.cesta && IMG.cesta.naturalWidth) ctx.drawImage(IMG.cesta, -P.w/2, -P.h, P.w, P.h);
    ctx.restore();
  }
  ctx.restore();
}

/* ======================= Loop ======================= */
let last = performance.now();
function loop(now){
  let dt = (now - last) / 1000; last = now;
  dt = Math.min(dt, 1/30);
  update(dt);
  render();
  requestAnimationFrame(loop);
}
loadAll.then(() => { last = performance.now(); requestAnimationFrame(loop); $('startBtn').focus(); });
})();
</script>
</body>
